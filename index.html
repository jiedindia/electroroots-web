<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electroroots - Coming Soon</title>
    <meta name="description" content="Electroroots is coming soon. Get ready for the next generation of tech.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background Elements -->
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    
    <!-- Main Content -->
    <div class="container">
        <!-- Logo Section -->
        <div class="logo-container">
            <img src="logo.png" alt="Electroroots Logo" class="logo-img">
            <h1 class="logo-text">ELECTRO ROOTS</h1>
        </div>

        <!-- Coming Soon Element -->
        <div class="coming-soon-wrapper">
            <h2 class="coming-soon-text">COMING SOON</h2>
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
        </div>

        <!-- Contact Section -->
        <div class="contact-section">
            <a href="tel:+918981104676" class="contact-button" onclick="copyNumber(event)">Contact Us</a>
        </div>
    </div>

    <script>
        function copyNumber(event) {
            navigator.clipboard.writeText('+91 89811 04676').then(() => {
                const btn = event.target;
                const originalText = btn.innerText;
                btn.innerText = 'Number Copied!';
                setTimeout(() => {
                    btn.innerText = originalText;
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }
    </script>
</body>
</html>
